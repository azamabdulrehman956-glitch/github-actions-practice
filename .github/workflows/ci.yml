name: My First CI
on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      APP_NAME: Notes-App
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: show environment
        run: |
          echo "environment: $APP_ENV"
          echo "App- Name: $APP_NAME"
      - name: test secret
        run: echo "secret exist: ${{secrets.MY_SECRET != '' }}"
             

      - name: test
        run: echo "testing...."
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: build
        run: echo "building.."